<html lang="ru">

    <div class="wrapper">
      <include src="src/html/_header.html"></include>

      <main class="knowledge-page knowledge-calculator-page">
        <section class="section page-intro knowledge-intro knowledge-calculator-intro">
          <div class="section__container page-intro__container knowledge-intro__container">
            <div class="section__head page-intro__head">
              <ul class="section__breadcrumbs breadcrumbs" itemscope itemtype="https://schema.org/BreadcrumbList">
                <li class="breadcrumbs__item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                  <a href="/pages/home.html" itemprop="item">
                    <span itemprop="name">Главная</span>
                  </a>
                  <meta itemprop="position" content="1">
                </li>
                <li class="breadcrumbs__item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                  <a href="/pages/knowledge-base.html" itemprop="item">
                    <span itemprop="name">База знаний</span>
                  </a>
                  <meta itemprop="position" content="2">
                </li>
                <li class="breadcrumbs__item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                  <a href="/pages/knowledge-base-tools.html" itemprop="item">
                    <span itemprop="name">Инструменты</span>
                  </a>
                  <meta itemprop="position" content="3">
                </li>
                <li class="breadcrumbs__item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                  <span itemprop="name">Калькулятор светодиодной ленты</span>
                  <meta itemprop="position" content="4">
                </li>
              </ul>
              <h1 class="section__title page-intro__title">Калькулятор светодиодной ленты</h1>
            </div>
          </div>
        </section>

        <section class="section tape-calculator" data-calculator>
          <div class="section__container tape-calculator__container">
            <div class="tape-calculator__layout">
              <div class="tape-calculator__main">
                <div class="tape-calculator__forms" data-calculator-forms></div>
                <div class="tape-calculator__actions" data-calculator-actions>
                  <button type="button" class="action-button action-button_primary tape-calculator__submit" data-calculator-submit>
                    Подобрать ленту
                    <i>
                      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                        <use xlink:href="/img/sprite.svg#arrow-right"></use>
                      </svg>
                    </i>
                  </button>
                  <button type="button" class="action-button action-button_outline tape-calculator__clear" data-calculator-clear>
                    Очистить
                  </button>
                </div>
                <div class="tape-calculator__result" data-calculator-result></div>
                <div class="tape-calculator__info" data-calculator-info hidden></div>
              </div>

              <a href="https://www.youtube.com/watch?v=JIthIaJUmD4&ab_channel=novolampa.ru" target="_blank" class="tape-calculator__video _md-1150-dn" aria-label="Видеоинструкция">
                <h2 class="tape-calculator__video-title">
                  Ничего не понятно? Посмотрите видеоинструкцию
                </h2>
                <i class="tape-calculator__video-play" aria-label="Смотреть видеоинструкцию">
                  <svg width="81" height="81" viewBox="0 0 81 81" aria-hidden="true">
                    <use xlink:href="/img/colored.svg#play-icon"></use>
                  </svg>
                </i>
              </a>
            </div>
          </div>

          <template data-calculator-template="segment">
            <form class="tape-segment" method="post" enctype="multipart/form-data" data-calculator-segment>
              <input type="hidden" name="sessid" data-calculator-field="sessid">
              <input type="hidden" name="FORM_ID" data-calculator-field="FORM_ID">
              <input type="hidden" name="init" value="Y" data-calculator-init>
              <input type="hidden" name="room_name" data-calculator-room-hidden>
              <input type="hidden" name="CART" data-calculator-cart hidden>

              <div class="tape-segment__head" data-calculator-segment-head>
                <div class="tape-segment__room" data-calculator-room>
                  <span class="tape-segment__room-label">Название помещения</span>
                  <button type="button" class="tape-segment__room-name" data-calculator-room-name></button>
                  <div class="tape-segment__room-edit" data-calculator-room-edit hidden>
                    <label class="form__item form__item_shadow tape-segment__room-field">
                      <input type="text" class="form__input" data-calculator-room-input>
                      <span class="form__placeholder">Название помещения</span>
                    </label>
                    <button type="button" class="tape-segment__room-submit" data-calculator-room-submit>Ок</button>
                    <button type="button" class="tape-segment__room-cancel" data-calculator-room-cancel>Отмена</button>
                  </div>
                </div>

                <div class="tape-segment__actions">
                  <button type="button" class="action-button action-button_outline tape-segment__add" data-calculator-add-segment>
                    <span class="_md3dn">Добавить помещение</span>
                    <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true" class="_mmd3dn">
                      <use xlink:href="/img/sprite.svg#plus"></use>
                    </svg>
                  </button>
                  <button type="button" class="tape-segment__delete" aria-label="Удалить помещение" data-calculator-delete-segment hidden>
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                      <use xlink:href="/img/sprite.svg#trash-delete"></use>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="tape-segment__body" data-calculator-segment-body>
                <div class="tape-segment__sections" data-calculator-sections></div>
              </div>
            </form>
          </template>

          <template data-calculator-template="section-sizes">
            <section class="tape-option tape-option_sizes" data-calculator-section>
              <h2 class="tape-option__title">
                <span data-calculator-section-index></span>
                <span data-calculator-section-title></span>
                <button type="button" class="tape-option__hint" data-calculator-tooltip aria-label="Показать подсказку">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <use xlink:href="/img/sprite.svg#question-message"></use>
                  </svg>
                </button>
              </h2>
              <div class="tape-option__sizes">
                <div class="tape-option__sizes-main" data-calculator-size-fields></div>
                <span class="tape-option__sizes-separator">или</span>
                <div class="tape-option__sizes-total" data-calculator-total-field></div>
              </div>
            </section>
          </template>

          <template data-calculator-template="section-options">
            <section class="tape-option" data-calculator-section>
              <h2 class="tape-option__title">
                <span data-calculator-section-index></span>
                <span data-calculator-section-title></span>
                <button type="button" class="tape-option__hint" data-calculator-tooltip aria-label="Показать подсказку">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <use xlink:href="/img/sprite.svg#question-message"></use>
                  </svg>
                </button>
              </h2>
              <div class="tape-option__items" data-calculator-options></div>
            </section>
          </template>

          <template data-calculator-template="field">
            <label class="form__item form__item_shadow tape-field" data-calculator-field-wrap>
              <input type="text" class="form__input" data-calculator-input>
              <span class="form__placeholder" data-calculator-field-label></span>
            </label>
          </template>

          <template data-calculator-template="radio">
            <label class="form__radiowrap" data-calculator-radio-wrap>
              <input type="radio" data-calculator-input>
              <i class="form__radio"></i>
              <span class="form__label" data-calculator-radio-label></span>
            </label>
          </template>

          <template data-calculator-template="result">
            <div class="tape-result" data-calculator-result-card>
              <h2 class="tape-result__title">Смотрите что у нас получилось!</h2>
              <div class="tape-result__head">
                <span>Товар</span>
                <span>Вес</span>
                <span>Цена</span>
                <span>Кол-во</span>
                <span>Сумма</span>
              </div>
              <div class="tape-result__rooms" data-calculator-result-rooms></div>
              <div class="tape-result__footer">
                <button type="button" class="action-button action-button_download tape-result__pdf" data-calculator-pdf>
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <use xlink:href="/img/sprite.svg#download"></use>
                  </svg>
                  Экспорт в PDF
                </button>
                <div class="tape-result__summary">
                  <span>Итого:</span>
                  <strong data-calculator-total-sum></strong>
                  <button type="button" class="action-button action-button_primary tape-result__cart" data-calculator-add-cart>
                    Добавить все товары в корзину
                    <i>
                      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                        <use xlink:href="/img/sprite.svg#arrow-right"></use>
                      </svg>
                    </i>
                  </button>
                </div>
              </div>
            </div>
          </template>

          <template data-calculator-template="result-room">
            <section class="tape-result-room" data-calculator-result-room>
              <h3 class="tape-result-room__title" data-calculator-result-room-title></h3>
              <div class="tape-result-room__items" data-calculator-result-items></div>
            </section>
          </template>

          <template data-calculator-template="result-item">
            <article class="tape-result-item" data-calculator-result-item>
              <a href="#" class="tape-result-item__image-link" data-calculator-product-link>
                <img src="" alt="" class="tape-result-item__image" data-calculator-product-image>
              </a>
              <div class="tape-result-item__content">
                <a href="#" class="tape-result-item__title" data-calculator-product-title></a>
                <div class="tape-result-item__meta">
                  <span>Арт: <span data-calculator-product-article></span></span>
                  <span class="tape-result-item__stock" data-calculator-product-stock></span>
                </div>
              </div>
              <div class="tape-result-item__weight" data-label="Вес" data-calculator-product-weight></div>
              <div class="tape-result-item__price" data-label="Цена" data-calculator-product-price></div>
              <div class="tape-result-item__quantity" data-label="Кол-во" data-calculator-product-quantity></div>
              <div class="tape-result-item__sum" data-label="Сумма" data-calculator-product-sum></div>
            </article>
          </template>

          <template data-calculator-template="info">
            <i class="tape-calculator__info-icon" aria-hidden="true">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <use xlink:href="/img/colored.svg#minus-plus"></use>
              </svg>
            </i>
            <div class="tape-calculator__info-content">
              <p>
                <strong>Уважаемый покупатель, данный подбор оборудования имеет рекомендательный характер.</strong>
              </p>
              <p>
                Для проверки результатов подбора и уточнения сроков поставки товара Вы можете связаться с нашими
                специалистами любым удобным для Вас способом. Информация для связи доступна в разделе контактов.
              </p>
            </div>
          </template>

          <template data-calculator-template="pdf">
            <div class="tape-pdf" data-calculator-pdf-document>
              <table class="tape-pdf__header">
                <tbody>
                  <tr>
                    <td><img src="" alt="" data-calculator-pdf-logo></td>
                    <td data-calculator-pdf-requisites></td>
                  </tr>
                </tbody>
              </table>
              <table class="tape-pdf__table">
                <thead>
                  <tr>
                    <th>Наименование</th>
                    <th>Кол-во</th>
                    <th>Ед.изм.</th>
                    <th>Цена</th>
                    <th>Сумма</th>
                    <th>Фото</th>
                  </tr>
                </thead>
                <tbody data-calculator-pdf-rows></tbody>
                <tfoot>
                  <tr>
                    <th colspan="4">Итого:</th>
                    <th colspan="2" data-calculator-pdf-total></th>
                  </tr>
                </tfoot>
              </table>
            </div>
          </template>

          <template data-calculator-template="pdf-room">
            <tr class="tape-pdf__room" data-calculator-pdf-room>
              <th colspan="6" data-calculator-pdf-room-title></th>
            </tr>
          </template>

          <template data-calculator-template="pdf-row">
            <tr class="tape-pdf__row" data-calculator-pdf-row>
              <td data-calculator-pdf-product-title></td>
              <td data-calculator-pdf-product-quantity></td>
              <td data-calculator-pdf-product-measure></td>
              <td data-calculator-pdf-product-price></td>
              <td data-calculator-pdf-product-sum></td>
              <td><img src="" alt="" data-calculator-pdf-product-image></td>
            </tr>
          </template>
