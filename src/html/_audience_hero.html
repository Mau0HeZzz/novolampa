<!--
  @fileOverview Общий hero-блок страниц для дизайнеров и бизнеса.
-->

<section class="audience-hero {{ modifier }}">
  <div class="page-hero audience-hero__media" style="--page-hero-image: url('{{ imagePath }}')">
    <div class="page-hero__body audience-hero__body">
      <include
        src="src/html/_breadcrumbs.html"
        locals='{"items": ["Главная"], "mainItem": "{{ breadcrumb }}"}'
      ></include>

      <div class="audience-hero__content">
        <h1 class="page-hero__title audience-hero__title">{{{ title }}}</h1>
        <p class="audience-hero__text">{{{ text }}}</p>
        <div class="audience-hero__actions">
          <a href="{{ primaryHref }}" class="action-button action-button_primary audience-hero__button">
            {{ primaryText }}
            <i>
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <use xlink:href="/img/sprite.svg#arrow-right"></use>
              </svg>
            </i>
          </a>
          <if condition="secondaryText">
            <a href="{{ secondaryHref }}" class="action-button audience-hero__button audience-hero__button_outline">
              {{ secondaryText }}
            </a>
          </if>
        </div>
      </div>
    </div>
  </div>
</section>
