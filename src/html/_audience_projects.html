<!--
  @fileOverview Общий блок реализованных проектов для тематических страниц.
-->

<section class="section solutions-projects audience-projects {{ modifier }}" id="{{ sectionId }}">
  <div class="section__container solutions-projects__container">
    <div class="solutions-projects__head">
      <div>
        <h2 class="solutions-title">Реализованные проекты</h2>
        <p class="solutions-subtitle">
          Реальные объекты, где применены наши решения освещения.
        </p>
      </div>
      <a
        href="/pages/projects.html"
        class="solutions-projects__all"
        data-da=".{{ actionsClass }}, 768, last"
      >Все проекты</a>
    </div>

    <div class="solutions-projects__grid">
      <a href="/pages/project.html" class="solutions-project-card">
        <img src="/img/solutions/projects-1.png" alt="">
        <span>Комплексное освещение фитнес-клуба Энкор</span>
      </a>
      <a href="/pages/project.html" class="solutions-project-card">
        <img src="/img/solutions/projects-2.png" alt="">
        <span>Внутреннее освещение клиники MEDALL</span>
      </a>
    </div>

    <div class="solutions-projects__actions {{ actionsClass }}">
      <a href="#" class="action-button action-button_outline solutions-projects__more _mmd-768-dn">Показать ещё</a>
    </div>
  </div>
</section>
