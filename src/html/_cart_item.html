<!--
  @fileOverview Переиспользуемая строка товара в корзине.
-->

<article class="cart-item" data-cart-item>
  <a href="#" class="cart-item__image">
    <img src="{{ imagePath }}" alt="{{ title }}">
  </a>

  <div class="cart-item__info">
    <a href="#" class="cart-item__title">{{ title }}</a>
    <div class="cart-item__meta">
      <span>Арт: {{ article }}</span>
      <span class="cart-item__stock">{{ stock }}</span>
    </div>
  </div>

  <div class="cart-item__unit-price">
    <strong>{{ price }} ₽</strong>
    <span>за 1 шт.</span>
  </div>

  <div class="quantity-form cart-item__quantity" data-quantity>
    <button type="button" class="quantity-form__button quantity-form__button_minus" aria-label="Уменьшить количество">
      <svg width="10" height="2" viewBox="0 0 10 2" fill="none" aria-hidden="true"><use xlink:href="/img/sprite.svg#minus"></use></svg>
    </button>
    <div class="quantity-form__input">
      <input autocomplete="off" type="text" value="{{ quantity }}" aria-label="Количество товара">
    </div>
    <button type="button" class="quantity-form__button quantity-form__button_plus" aria-label="Увеличить количество">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><use xlink:href="/img/sprite.svg#plus"></use></svg>
    </button>
  </div>

  <div class="cart-item__total">
    <strong>{{ total }} ₽</strong>
    <span>за {{ quantity }} шт.</span>
  </div>

  <div class="cart-item__actions">
    <button type="button" aria-label="Добавить товар в избранное">
      <svg width="14" height="19" viewBox="0 0 14 19" fill="none" aria-hidden="true"><use xlink:href="/img/sprite.svg#zakladka"></use></svg>
    </button>
    <button type="button" aria-label="Добавить товар к сравнению">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><use xlink:href="/img/sprite.svg#up-down"></use></svg>
    </button>
  </div>

  <button type="button" class="cart-item__remove" aria-label="Удалить товар из корзины">
    <svg width="6" height="6" viewBox="0 0 6 6" fill="none" aria-hidden="true"><use xlink:href="/img/sprite.svg#close"></use></svg>
  </button>
</article>
