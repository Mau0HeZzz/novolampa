<!--
  @fileOverview Строка таблицы IES-файлов.
-->

<tr class="ies-table__row">
  <td class="ies-table__article">{{ article }}</td>
  <td class="ies-table__title">{{ title }}</td>
  <td class="ies-table__brand">{{ brand }}</td>
  <td class="ies-table__download">
    <a href="#" class="ies-file-button" aria-label="Скачать IES файл">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <use xlink:href="/img/sprite.svg#download"></use>
      </svg>
    </a>
  </td>
  <td class="ies-table__product">
    <a href="#" class="ies-product-link">
      Перейти
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
        <use xlink:href="/img/sprite.svg#arrow-right"></use>
      </svg>
    </a>
  </td>
</tr>
