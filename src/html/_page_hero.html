<!--
  @fileOverview Универсальный hero-блок внутренних страниц.
-->

<section class="page-hero {{ modifier }}" style="--page-hero-image: url('{{ imagePath }}'); --page-hero-bg-position: {{ backgroundPosition }}; --min-height: {{ minHeight }};">
  <div class="page-hero__body">
    <if condition="showBreadcrumbs">
      <ul class="section__breadcrumbs breadcrumbs" itemscope itemtype="https://schema.org/BreadcrumbList">
        <each loop="item, index in items">
          <li class="breadcrumbs__item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <a href="{{ item === 'Главная' ? '/pages/home.html' : '#' }}" itemprop="item">
              <span itemprop="name">{{ item }}</span>
            </a>
            <meta itemprop="position" content="{{ index + 1 }}">
          </li>
        </each>
        <li class="breadcrumbs__item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
          <span itemprop="name">{{ mainItem }}</span>
          <meta itemprop="position" content="{{ items.length + 1 }}">
        </li>
      </ul>
    </if>
    <div class="page-hero__content">
      <h1 class="page-hero__title">{{{ title }}}</h1>
      <p class="page-hero__text"><span>{{{ text }}}</span></p>
      <if condition="primaryText">
        <div class="page-hero__actions">
          <if condition="primaryGoto">
            <a href="{{ primaryHref }}" class="action-button action-button_primary page-hero__button" data-goto="{{ primaryGoto }}">
              {{{ primaryText }}}
              <i>
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                  <use xlink:href="/img/sprite.svg#arrow-right"></use>
                </svg>
              </i>
            </a>
          </if>
          <else>
            <a href="{{ primaryHref }}" class="action-button action-button_primary page-hero__button">
              {{{ primaryText }}}
              <i>
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                  <use xlink:href="/img/sprite.svg#arrow-right"></use>
                </svg>
              </i>
            </a>
          </else>
          <if condition="secondaryText">
            <if condition="secondaryGoto">
              <a href="{{ secondaryHref }}" class="action-button action-button_light-outline page-hero__button page-hero__button_secondary" data-goto="{{ secondaryGoto }}">
                {{{ secondaryText }}}
              </a>
            </if>
            <else>
              <a href="{{ secondaryHref }}" class="action-button action-button_light-outline page-hero__button page-hero__button_secondary">
                {{{ secondaryText }}}
              </a>
            </else>
          </if>
        </div>
      </if>
    </div>
  </div>
  <if condition="showMetrics">
    <div class="hero-metrics" data-da=".{{ metricsSlotClass }}, 1150, last">
      <div class="hero-metrics__body">
        <each loop="metric in metrics">
          <div class="hero-metrics__item">
            <strong>{{ metric.value }}</strong>
            <span>{{ metric.label }}</span>
          </div>
        </each>
      </div>
    </div>
  </if>
</section>
<if condition="showMetrics">
  <div class="{{ metricsSlotClass }}"></div>
</if>
