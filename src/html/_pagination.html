<!--
  @fileOverview Переиспользуемая пагинация списка.
-->

<nav class="pagination" aria-label="Пагинация">
  <a href="#" class="pagination__arrow pagination__arrow_prev" aria-label="Предыдущая страница">
    <svg aria-hidden="true" width="20" height="20"><use xlink:href="/img/sprite.svg#pagination-arrow-left"></use></svg>
  </a>
  <ul class="pagination__list">
    <li><a href="#" class="pagination__item _active" aria-current="page">1</a></li>
    <li><a href="#" class="pagination__item">2</a></li>
    <li><a href="#" class="pagination__item">3</a></li>
    <li class="pagination__desktop-item"><a href="#" class="pagination__item">4</a></li>
    <li class="pagination__desktop-item"><a href="#" class="pagination__item">5</a></li>
    <li><span class="pagination__item pagination__item_gap">...</span></li>
    <li><a href="#" class="pagination__item">{{ last }}</a></li>
  </ul>
  <a href="#" class="pagination__arrow pagination__arrow_next" aria-label="Следующая страница">
    <svg aria-hidden="true" width="20" height="20"><use xlink:href="/img/sprite.svg#pagination-arrow-right"></use></svg>
  </a>
</nav>
