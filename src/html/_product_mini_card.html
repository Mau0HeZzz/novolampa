<!--
  @fileOverview Переиспользуемая компактная карточка товара для каталогов, слайдеров и подборок.
-->

<article class="product-mini-card {{ modifier }} {{ inCart === 'true' ? '_in-cart' : '' }}">
  <a href="/pages/product.html" class="product-mini-card__link" aria-label="{{ title }}"></a>

  <if condition="typeof showCompareRemoveButton !== 'undefined' && showCompareRemoveButton">
    <button type="button" class="product-mini-card__compare-remove" aria-label="Удалить товар из сравнения">
      <svg width="10" height="10" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <use xlink:href="/img/sprite.svg#close"></use>
      </svg>
    </button>
  </if>
  <else>
    <button type="button" class="product-mini-card__compare" aria-label="Добавить товар к сравнению">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <use xlink:href="/img/sprite.svg#up-down"></use>
      </svg>
    </button>
  </else>

  <if condition="typeof showCompareRemoveButton === 'undefined' || !showCompareRemoveButton">
    <if condition="typeof showRemoveButton !== 'undefined' && showRemoveButton">
      <button type="button" class="product-mini-card__remove" aria-label="Удалить товар из избранного">
        <svg width="10" height="10" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <use xlink:href="/img/sprite.svg#close"></use>
        </svg>
      </button>
    </if>
    <else>
      <button type="button" class="product-mini-card__favorite" aria-label="Добавить товар в избранное">
        <svg width="14" height="19" viewBox="0 0 14 19" fill="none" aria-hidden="true">
          <use xlink:href="/img/sprite.svg#zakladka"></use>
        </svg>
      </button>
    </else>
  </if>

  <div class="product-mini-card__media">
    <img src="{{ imagePath }}" alt="{{ title }}">
  </div>

  <div class="product-mini-card__body">
    <span class="product-mini-card__eyebrow">{{ eyebrow }}</span>
    <span class="product-mini-card__title">{{ title }}</span>
    <a href="/pages/product.html" class="product-mini-card__documentation">Документация</a>

    <div class="product-mini-card__meta">
      <span>Арт: {{ article }}</span>
      <span
        class="product-mini-card__stock"
        style="--circle-bg: {{ stock === 'В наличии 135 шт' ? 'var(--bg-green-color)' : '#c7cbd0' }}"
      >{{ stock }}</span>
    </div>

    <div class="product-mini-card__price">
      <strong>{{ price }} ₽</strong>
      <span>за 1 шт.</span>
    </div>

    <div class="product-mini-card__desktop-actions">
      <a href="#" class="product-mini-card__desktop-cart product-mini-card__desktop-cart_add" aria-label="Добавить товар в корзину">
        <span class="_md-768-dn">В корзину</span>
        <svg class="_mmd-768-dn" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <use xlink:href="/img/sprite.svg#basket-full"></use>
        </svg>
      </a>

      <a href="#" class="product-mini-card__desktop-cart product-mini-card__desktop-cart_in-cart" aria-label="Товар в корзине">
        <span class="_md-768-dn">В корзине</span>
        <svg class="_mmd-768-dn" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <use xlink:href="/img/sprite.svg#basket-full"></use>
        </svg>
      </a>

      <div class="quantity-form product-mini-card__desktop-quantity" data-quantity>
        <button type="button" class="quantity-form__button quantity-form__button_minus" aria-label="Уменьшить количество">
          <svg width="10" height="2" viewBox="0 0 10 2" fill="none" aria-hidden="true">
            <use xlink:href="/img/sprite.svg#minus"></use>
          </svg>
        </button>
        <div class="quantity-form__input">
          <input autocomplete="off" type="text" name="quantity" value="{{ quantity }}" aria-label="Количество товара">
        </div>
        <button type="button" class="quantity-form__button quantity-form__button_plus" aria-label="Увеличить количество">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <use xlink:href="/img/sprite.svg#plus"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</article>
