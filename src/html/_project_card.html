  @fileOverview Переиспользуемая карточка реализованного проекта.
-->

<a href="#" class="project-card">
  <span class="project-card__media">
    <img src="/img/projects/list-item-{{ image }}.png" alt="">
    <span class="project-card__address">{{ address }}</span>
    <span class="project-card__title">{{ title }}</span>
  </span>
  <span class="project-card__body">
    <span class="project-card__description">{{ description }}</span>
    <span class="project-card__area">Площадь: {{ area }} м²</span>
  </span>
</a>
